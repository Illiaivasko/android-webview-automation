[project]
name = "android-webview-automation"
version = "0.1.0"
description = "Automated UI Test Suite for Android WebView using Appium, Pytest, and Page Object Model"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "Appium-Python-Client>=4.0.0",
    "pytest>=8.3.0",
    "pytest-html>=4.1.1",
    "pydantic-settings>=2.5.0",
    "pydantic>=2.9.0",
]

[dependency-groups]
dev = [
    "ruff>=0.6.5",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.uv]
package = false

[tool.ruff]
target-version = "py311"
line-length = 100
src = ["pages", "config", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "B", "SIM"]
ignore = ["B008"]

[tool.ruff.lint.per-file-ignores]
"reports/*" = ["E501"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-v --tb=short --html=reports/pytest_report.html --self-contained-html"
